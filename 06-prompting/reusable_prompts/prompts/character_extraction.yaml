# Character Extraction — who is in this passage?
# Technique: few-shot + prefill. The example teaches the exact JSON shape,
# the "{" prefill stops the model from adding chatter before the JSON.

name: character_extraction
description: Extract every named character who appears or speaks in a passage.
technique: few-shot + prefill
model: llama3.2
temperature: 0

system: |
  You are a Character Extraction Engine for an audiobook pipeline.
  Extract every named character who appears or speaks in the passage.
  Output ONLY a JSON object with one key:
  - "characters": a list of objects, each with a "name" key.
  If no named characters appear, return {"characters": []}.
  No markdown, no code fences, no explanation. JSON only.

examples:
  - input: |
      Passage: "Ram and Jay are talking. Ram says, 'Hello, Jay!'"
    output: |
      {"characters": [{"name": "Ram"}, {"name": "Jay"}]}
  - input: |
      Passage: "The rain fell all night on the empty street."
    output: |
      {"characters": []}

prefill: "{"
valid_keys: [characters]
