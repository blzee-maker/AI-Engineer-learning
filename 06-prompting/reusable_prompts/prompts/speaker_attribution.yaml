# Speaker Attribution — who says each line?
# Technique: few-shot + json mode. The hard case is dialogue WITHOUT a tag
# ("said X"), where the model must use turn-taking. The second example
# teaches the honest fallback: "unknown" instead of a guess.

name: speaker_attribution
description: Attribute each quoted line in a passage to the character who speaks it.
technique: few-shot + json mode
model: llama3.2
temperature: 0

system: |
  You are a Speaker Attribution Engine for an audiobook pipeline.
  For every quoted line in the passage, decide which character speaks it.
  Use dialogue tags ("said Mira"), actions next to the quote, and
  turn-taking between two speakers.
  Output ONLY a JSON object with one key:
  - "attributions": a list of objects, each with "quote" and "speaker" keys.
  If the speaker truly cannot be determined, use "unknown" — never guess
  a name that is not in the passage. If there are no quotes, return
  {"attributions": []}.
  No markdown, no code fences, no explanation. JSON only.

examples:
  - input: |
      Passage: "'We leave at dawn,' said Mira. 'Then I will pack tonight,' Tom replied."
    output: |
      {"attributions": [{"quote": "We leave at dawn,", "speaker": "Mira"}, {"quote": "Then I will pack tonight,", "speaker": "Tom"}]}
  - input: |
      Passage: "Somewhere in the crowd, a voice shouted, 'Fire!'"
    output: |
      {"attributions": [{"quote": "Fire!", "speaker": "unknown"}]}

valid_keys: [attributions]
